# Environment file for `gcloud run deploy --env-vars-file`.
# Copy to deployment/env.cloudrun.yaml (gitignored) and fill in your values.
# The ClickHouse password is NOT set here — it comes from Secret Manager via
# `--set-secrets CLICKHOUSE_PASSWORD=clickhouse-password:latest`.

GCP_PROJECT_ID: your-gcp-project-id
GCP_LOCATION: us-central1          # Vertex AI regional endpoint (Veo, Imagen)
GCP_GLOBAL_LOCATION: global        # Gemini 3.x / Omni live on the global endpoint
GCS_BUCKET: your-media-bucket      # media store; leave unset only for local runs
GREENLIGHT_STORE: firestore        # project state; "local" writes files inside the container (lost on redeploy)

# ClickHouse — the learning ledger. Optional: without it the planner falls back to
# the priors in config/priors.yaml and the UI says so. For a Cloud Run service the
# host must be reachable from the service (private IP via VPC egress, or a public
# ClickHouse Cloud endpoint with TLS).
CLICKHOUSE_HOST: 10.0.0.2
CLICKHOUSE_PORT: '8123'
CLICKHOUSE_USER: default
CLICKHOUSE_DB: greenlight

# Optional
# GREENLIGHT_DEMO_MODE: 'true'           # read-only public demo: every write/spend returns 402
#                                         # (the budget ceiling itself lives in config/pricing.yaml)
